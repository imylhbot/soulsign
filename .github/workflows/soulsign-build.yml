name: SoulSign Build & Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '可选：如 v0.1.0；留空自动使用 build-运行编号 并发布 Release'
        required: false
        type: string
      upstream_ref:
        description: 'MJorb 分支、标签或 commit；默认固定已验证 commit'
        required: false
        default: '4c24fda2c97f8d275b748ba069a9af0ba89b62d2'
        type: string

concurrency:
  group: soulsign-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      SOULSIGN_SRC: /tmp/SoulSign-src
      MJORB_URL: https://github.com/dmjorb/MJorb.git
      MJORB_REF: ${{ inputs.upstream_ref }}

    steps:
      - name: Checkout SoulSign bootstrap repository
        uses: actions/checkout@v6.0.2

      - name: Generate complete SoulSign source on GitHub runner
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "$SOULSIGN_SRC"
          bash "$GITHUB_WORKSPACE/bootstrap.sh" "$SOULSIGN_SRC"

          if [ -f "$GITHUB_WORKSPACE/soulsign.png" ]; then
            cp "$GITHUB_WORKSPACE/soulsign.png" "$SOULSIGN_SRC/soulsign.png"
          fi

          echo "Generated source: $SOULSIGN_SRC"
          test -f "$SOULSIGN_SRC/project.yml"
          test -f "$SOULSIGN_SRC/Scripts/audit-rustbridge-source.sh"
          test -f "$SOULSIGN_SRC/Scripts/ensure-rustbridge.sh"
          test -f "$SOULSIGN_SRC/Scripts/verify-rustbridge-symbols.sh"
          test -f "$SOULSIGN_SRC/Scripts/build-unsigned-ipa.sh"

      # Archive source BEFORE compiling Rust/Xcode. This keeps Cargo target,
      # DerivedData and build products out of the corresponding-source archive.
      - name: Archive clean SoulSign source
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "$GITHUB_WORKSPACE/out"
          mkdir -p "$GITHUB_WORKSPACE/out"
          SOURCE_PARENT="$(dirname "$SOULSIGN_SRC")"
          SOURCE_NAME="$(basename "$SOULSIGN_SRC")"
          (
            cd "$SOURCE_PARENT"
            zip -qry "$GITHUB_WORKSPACE/out/SoulSign-source.zip" "$SOURCE_NAME" \
              -x '*/.git/*' '*/build/*' '*/DerivedData/*' '*/target/*' '*/.build/*'
          )
          du -h "$GITHUB_WORKSPACE/out/SoulSign-source.zip"

      - name: Select Xcode 26.5
        shell: bash
        run: |
          set -euxo pipefail
          test -d /Applications/Xcode_26.5.app
          sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version

      - name: Install Rust toolchain used by upstream
        shell: bash
        run: |
          set -euxo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component llvm-tools-preview
          rustup default 1.97.1
          rustc --version
          cargo --version

      # Cache Cargo downloads and RustBridge compilation output. The first build
      # can still take a while; later builds on the same upstream/toolchain should
      # normally reuse most Rust work.
      - name: Restore Rust build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/SoulSign-src/Vendor/Minimuxer/RustBridge/target
          key: soulsign-rust-${{ runner.os }}-1.97.1-${{ inputs.upstream_ref }}
          restore-keys: |
            soulsign-rust-${{ runner.os }}-1.97.1-

      - name: Prepare upstream RustBridge
        shell: bash
        working-directory: ${{ env.SOULSIGN_SRC }}
        env:
          RUST_TOOLCHAIN: 1.97.1
        run: |
          set -euxo pipefail
          bash Scripts/audit-rustbridge-source.sh
          bash Scripts/ensure-rustbridge.sh
          bash Scripts/verify-rustbridge-symbols.sh

      - name: Apply SoulSign icon
        shell: bash
        working-directory: ${{ env.SOULSIGN_SRC }}
        run: |
          set -euxo pipefail
          bash .soulsign-tools/install_icon.sh .

      - name: Install XcodeGen 2.45.4
        shell: bash
        run: |
          set -euxo pipefail
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/xcodegen.zip" \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.45.4/xcodegen.zip
          echo "090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          ditto -x -k "$RUNNER_TEMP/xcodegen.zip" "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate Xcode project
        shell: bash
        working-directory: ${{ env.SOULSIGN_SRC }}
        run: |
          set -euxo pipefail
          xcodegen generate

      - name: Build unsigned SoulSign IPA
        shell: bash
        working-directory: ${{ env.SOULSIGN_SRC }}
        run: |
          set -euxo pipefail
          SEAL_IPA_CONFIGURATION=Release SEAL_SKIP_XCODEGEN=1 bash Scripts/build-unsigned-ipa.sh
          bash Scripts/verify-ipa.sh build/Seal.ipa
          cp build/Seal.ipa build/SoulSign.ipa
          (cd build && shasum -a 256 SoulSign.ipa | awk '{print $1 "  SoulSign.ipa"}' > SoulSign.ipa.sha256)

          echo "===== Final IPA size ====="
          du -h build/SoulSign.ipa
          stat -f 'SoulSign.ipa exact bytes: %z' build/SoulSign.ipa
          echo "=========================="

      - name: Prepare IPA artifact files
        shell: bash
        run: |
          set -euxo pipefail
          cp "$SOULSIGN_SRC/build/SoulSign.ipa" "$GITHUB_WORKSPACE/out/"
          cp "$SOULSIGN_SRC/build/SoulSign.ipa.sha256" "$GITHUB_WORKSPACE/out/"
          [ ! -f "$SOULSIGN_SRC/build/Seal-Info.plist" ] || cp "$SOULSIGN_SRC/build/Seal-Info.plist" "$GITHUB_WORKSPACE/out/"
          [ ! -f "$SOULSIGN_SRC/build/SealTunnel-Info.plist" ] || cp "$SOULSIGN_SRC/build/SealTunnel-Info.plist" "$GITHUB_WORKSPACE/out/"

          echo "===== Files prepared ====="
          du -h "$GITHUB_WORKSPACE/out/"* || true

      # Actions artifact is intentionally IPA-only. The source archive is attached
      # to the GitHub Release instead, so downloading the artifact does not mean
      # downloading hundreds of MB of source/build data.
      - name: Upload SoulSign IPA artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: SoulSign-${{ github.run_number }}
          if-no-files-found: error
          compression-level: 0
          path: |
            out/SoulSign.ipa
            out/SoulSign.ipa.sha256
            out/*-Info.plist
          retention-days: 30

      - name: Resolve Release tag
        id: release_meta
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_TAG" ]; then
            TAG="$REQUESTED_TAG"
          else
            TAG="build-${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "SoulSign will publish Release tag: $TAG"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
        run: |
          set -euxo pipefail
          FILES=(
            out/SoulSign.ipa
            out/SoulSign.ipa.sha256
            out/SoulSign-source.zip
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${FILES[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${FILES[@]}" \
              --title "SoulSign $RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --generate-notes
          fi
