name: SoulSign Build & Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '可选：如 v0.1.0；留空自动使用 build-运行编号'
        required: false
        type: string
      upstream_ref:
        description: '固定 MJorb commit；仅升级上游时修改'
        required: false
        default: '4c24fda2c97f8d275b748ba069a9af0ba89b62d2'
        type: string

concurrency:
  group: soulsign-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      SOULSIGN_SRC: /tmp/SoulSign-src
      MJORB_URL: https://github.com/dmjorb/MJorb.git
      MJORB_REF: ${{ inputs.upstream_ref }}

    steps:
      - name: Checkout SoulSign repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 1

      # First v8 run downloads the pinned upstream once. It then tries to commit
      # that clean source snapshot into this repository. Future builds use it
      # directly and bootstrap no longer has to clone MJorb.
      - name: Ensure pinned MJorb source is stored in this repository
        id: vendor
        shell: bash
        run: |
          set -euxo pipefail
          bash tools/vendor_upstream.sh "$GITHUB_WORKSPACE"

          if ! git diff --quiet -- vendor/MJorb || [ -n "$(git status --porcelain -- vendor/MJorb)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add vendor/MJorb
            git commit -m "chore: vendor pinned MJorb ${MJORB_REF}" || true
            # A protected branch may reject this; do not break the current build.
            git push origin "HEAD:${GITHUB_REF_NAME}" || echo "::warning::Could not push vendored upstream; current build will still use it."
          fi

      - name: Generate complete SoulSign source from vendored upstream
        shell: bash
        env:
          MJORB_VENDOR_DIR: ${{ github.workspace }}/vendor/MJorb
        run: |
          set -euxo pipefail
          rm -rf "$SOULSIGN_SRC"
          bash "$GITHUB_WORKSPACE/bootstrap.sh" "$SOULSIGN_SRC"

          if [ -f "$GITHUB_WORKSPACE/soulsign.png" ]; then
            cp "$GITHUB_WORKSPACE/soulsign.png" "$SOULSIGN_SRC/soulsign.png"
          fi

          test -f "$SOULSIGN_SRC/project.yml"
          test -f "$SOULSIGN_SRC/Scripts/build-unsigned-ipa.sh"

      - name: Prepare output directory and clean source archive
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "$GITHUB_WORKSPACE/out"
          mkdir -p "$GITHUB_WORKSPACE/out"
          (
            cd "$(dirname "$SOULSIGN_SRC")"
            zip -qry "$GITHUB_WORKSPACE/out/SoulSign-source.zip" "$(basename "$SOULSIGN_SRC")" \
              -x '*/.git/*' '*/build/*' '*/DerivedData/*' '*/target/*' '*/.build/*'
          )

      - name: Select Xcode 26.5
        shell: bash
        run: |
          set -euxo pipefail
          test -d /Applications/Xcode_26.5.app
          sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version

      - name: Restore Rust and RustBridge cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
            /tmp/SoulSign-src/Vendor/Minimuxer/RustBridge/target
          key: soulsign-rust-v8-${{ runner.os }}-1.97.1-${{ inputs.upstream_ref }}
          restore-keys: |
            soulsign-rust-v8-${{ runner.os }}-1.97.1-

      - name: Ensure Rust toolchain
        shell: bash
        run: |
          set -euxo pipefail
          if ! rustup toolchain list | grep -q '^1\.97\.1'; then
            rustup toolchain install 1.97.1 --profile minimal --component llvm-tools-preview
          fi
          rustup default 1.97.1
          rustc --version
          cargo --version

      - name: Prepare RustBridge only when verification requires it
        shell: bash
        working-directory: ${{ env.SOULSIGN_SRC }}
        env:
          RUST_TOOLCHAIN: 1.97.1
        run: |
          set -euxo pipefail
          if bash Scripts/verify-rustbridge-symbols.sh >/dev/null 2>&1; then
            echo "RustBridge verification already passes; skipping rebuild."
          else
            bash Scripts/audit-rustbridge-source.sh
            bash Scripts/ensure-rustbridge.sh
            bash Scripts/verify-rustbridge-symbols.sh
          fi

      - name: Apply SoulSign icon
        shell: bash
        working-directory: ${{ env.SOULSIGN_SRC }}
        run: |
          set -euxo pipefail
          bash .soulsign-tools/install_icon.sh .

      - name: Install XcodeGen 2.45.4
        shell: bash
        run: |
          set -euxo pipefail
          XG="$RUNNER_TEMP/xcodegen/xcodegen/bin/xcodegen"
          if [ ! -x "$XG" ]; then
            curl --fail --location --silent --show-error \
              --output "$RUNNER_TEMP/xcodegen.zip" \
              https://github.com/yonaskolb/XcodeGen/releases/download/2.45.4/xcodegen.zip
            echo "090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
            mkdir -p "$RUNNER_TEMP/xcodegen"
            ditto -x -k "$RUNNER_TEMP/xcodegen.zip" "$RUNNER_TEMP/xcodegen"
          fi
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate Xcode project
        shell: bash
        working-directory: ${{ env.SOULSIGN_SRC }}
        run: |
          set -euxo pipefail
          xcodegen generate

      - name: Build unsigned SoulSign IPA
        shell: bash
        working-directory: ${{ env.SOULSIGN_SRC }}
        run: |
          set -euxo pipefail
          SEAL_IPA_CONFIGURATION=Release SEAL_SKIP_XCODEGEN=1 bash Scripts/build-unsigned-ipa.sh
          bash Scripts/verify-ipa.sh build/Seal.ipa
          cp build/Seal.ipa build/SoulSign.ipa
          (cd build && shasum -a 256 SoulSign.ipa | awk '{print $1 "  SoulSign.ipa"}' > SoulSign.ipa.sha256)
          du -h build/SoulSign.ipa
          stat -f 'SoulSign.ipa exact bytes: %z' build/SoulSign.ipa

      - name: Inspect IPA for launch diagnostics
        shell: bash
        run: |
          set -euo pipefail
          DIAG="$GITHUB_WORKSPACE/out/SoulSign-diagnostics.txt"
          TMP="$RUNNER_TEMP/soulsign-ipa-check"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          ditto -x -k "$SOULSIGN_SRC/build/SoulSign.ipa" "$TMP"
          APP="$(find "$TMP/Payload" -maxdepth 1 -type d -name '*.app' | head -1)"
          {
            echo "SoulSign build diagnostics"
            echo "run=${GITHUB_RUN_ID} commit=${GITHUB_SHA} upstream=${MJORB_REF}"
            echo "app=$APP"
            echo
            echo "== Bundle metadata =="
            /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" 2>&1 || true
            /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist" 2>&1 || true
            /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist" 2>&1 || true
            /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist" 2>&1 || true
            EXE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist" 2>/dev/null || true)"
            echo
            echo "== Main executable =="
            [ -z "$EXE" ] || file "$APP/$EXE" || true
            [ -z "$EXE" ] || lipo -info "$APP/$EXE" 2>&1 || true
            [ -z "$EXE" ] || otool -L "$APP/$EXE" 2>&1 || true
            echo
            echo "== Embedded frameworks/extensions =="
            find "$APP" -maxdepth 3 \( -name '*.framework' -o -name '*.appex' -o -name '*.dylib' \) -print | sort
            echo
            echo "== Largest files =="
            find "$APP" -type f -exec du -k {} + | sort -nr | head -40
            echo
            echo "== Signature status (unsigned build is expected here) =="
            codesign -dvvv "$APP" 2>&1 || true
          } > "$DIAG"
          cat "$DIAG"

      - name: Prepare release files
        shell: bash
        run: |
          set -euxo pipefail
          cp "$SOULSIGN_SRC/build/SoulSign.ipa" "$GITHUB_WORKSPACE/out/"
          cp "$SOULSIGN_SRC/build/SoulSign.ipa.sha256" "$GITHUB_WORKSPACE/out/"
          du -h "$GITHUB_WORKSPACE/out/"* || true

      - name: Upload SoulSign IPA artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: SoulSign-${{ github.run_number }}
          if-no-files-found: error
          compression-level: 0
          path: |
            out/SoulSign.ipa
            out/SoulSign.ipa.sha256
            out/SoulSign-diagnostics.txt
          retention-days: 30

      - name: Resolve Release tag
        id: release_meta
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_TAG" ]; then TAG="$REQUESTED_TAG"; else TAG="build-${GITHUB_RUN_NUMBER}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
        run: |
          set -euxo pipefail
          FILES=(
            out/SoulSign.ipa
            out/SoulSign.ipa.sha256
            out/SoulSign-diagnostics.txt
            out/SoulSign-source.zip
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${FILES[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${FILES[@]}" \
              --title "SoulSign $RELEASE_TAG" --target "$GITHUB_SHA" --generate-notes
          fi
